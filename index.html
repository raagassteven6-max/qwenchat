<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Qwen Chat</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface-hover: #1c2128;
    --border: #30363d;
    --text: #c9d1d9;
    --text-secondary: #8b949e;
    --accent: #58a6ff;
    --accent-hover: #79b8ff;
    --user-bubble: #1f6feb;
    --assistant-bubble: #21262d;
    --shadow: 0 4px 12px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }
  #header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    position: sticky; top: 0; z-index: 10;
  }
  #header .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #3fb950; box-shadow: 0 0 8px #3fb950;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  #header h1 { font-size: 16px; font-weight: 600; }
  #header .sub { font-size: 12px; color: var(--text-secondary); margin-left: auto; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    -webkit-overflow-scrolling: touch;
  }
  .msg {
    display: flex;
    flex-direction: column;
    max-width: 85%;
    animation: slideIn .25s ease-out;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 12px 16px;
    border-radius: 18px;
    line-height: 1.55;
    font-size: 15px;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .user .bubble {
    background: var(--user-bubble);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .assistant .bubble {
    background: var(--assistant-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .timestamp {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 4px;
    padding: 0 4px;
  }

  .typing {
    display: flex;
    gap: 6px;
    padding: 16px;
    align-self: flex-start;
  }
  .typing span {
    width: 8px; height: 8px;
    background: var(--text-secondary);
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .typing span:nth-child(1) { animation-delay: -0.32s; }
  .typing span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }

  #input-area {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 16px 24px;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }
  #msg-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 12px 18px;
    color: var(--text);
    font-size: 16px;
    outline: none;
    transition: border-color .2s;
  }
  #msg-input:focus { border-color: var(--accent); }
  #send-btn {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    cursor: pointer;
    transition: background .2s;
    flex-shrink: 0;
  }
  #send-btn:active { background: var(--accent-hover); transform: scale(0.95); }
  #send-btn:disabled { background: var(--border); cursor: not-allowed; }

  .error-toast {
    position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
    background: #da3633; color: #fff; padding: 10px 20px;
    border-radius: 8px; font-size: 13px; z-index: 100;
    box-shadow: var(--shadow); animation: fadeIn .3s;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -10px); } to { opacity: 1; } }

  .empty-state {
    text-align: center; color: var(--text-secondary);
    margin: auto; padding: 40px 20px;
  }
  .empty-state h2 { font-size: 20px; margin-bottom: 8px; color: var(--text); }
  .empty-state p { font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>

<div id="header">
  <div class="dot"></div>
  <h1>Qwen 2.5-3B</h1>
  <span class="sub">Free • No Token</span>
</div>

<div id="chat">
  <div class="empty-state" id="empty">
    <h2>How can I help you?</h2>
    <p>Running on Hugging Face Inference API<br>No account or token needed</p>
  </div>
</div>

<div id="input-area">
  <input id="msg-input" type="text" placeholder="Message..." autocomplete="off" enterkeyhint="send">
  <button id="send-btn" aria-label="Send">➤</button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('msg-input');
const btn = document.getElementById('send-btn');
const empty = document.getElementById('empty');

// Point this at your deployed Cloudflare Worker (worker.js), NOT directly at
// Hugging Face — the token lives server-side in the worker, never here.
const API_URL = "https://hf-proxy.stevenedwardraagas.workers.dev";
let history = []; // stores {role, content}
let isTyping = false;

function now() {
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function addBubble(text, isUser) {
  if (empty) empty.style.display = 'none';
  const msg = document.createElement('div');
  msg.className = 'msg ' + (isUser ? 'user' : 'assistant');
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  msg.appendChild(bubble);
  const ts = document.createElement('div');
  ts.className = 'timestamp';
  ts.textContent = now();
  msg.appendChild(ts);
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typing-indicator';
  div.innerHTML = '<span></span><span></span><span></span>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function showError(msg) {
  const toast = document.createElement('div');
  toast.className = 'error-toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 4000);
}

// No longer needed — the chat completions endpoint takes history directly
// as a messages array.

async function send() {
  const text = input.value.trim();
  if (!text || isTyping) return;
  input.value = '';
  isTyping = true;
  btn.disabled = true;

  addBubble(text, true);
  showTyping();

  // Add user turn to history
  history.push({ role: 'user', content: text });
  // Keep last 6 exchanges (12 turns) to stay within context
  if (history.length > 12) history = history.slice(-12);

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "Qwen/Qwen2.5-3B-Instruct",
        messages: history,
        max_tokens: 512,
        temperature: 0.7,
        top_p: 0.9
      })
    });

    hideTyping();

    if (res.status === 429) {
      showError("Rate limited. Wait ~2 minutes and try again.");
      isTyping = false; btn.disabled = false; return;
    }
    if (res.status === 503) {
      showError("Model is loading (cold start). Try again in 30s.");
      isTyping = false; btn.disabled = false; return;
    }
    if (res.status === 401 || res.status === 403) {
      showError("Auth error — check the token set in your proxy worker.");
      isTyping = false; btn.disabled = false; return;
    }
    if (!res.ok) {
      showError("Server error (" + res.status + "). Try again.");
      isTyping = false; btn.disabled = false; return;
    }

    const data = await res.json();

    let reply = "";
    if (data.choices?.[0]?.message?.content) {
      reply = data.choices[0].message.content;
    } else if (data.error) {
      throw new Error(typeof data.error === "string" ? data.error : data.error.message || "API error");
    } else {
      throw new Error("Unexpected response");
    }

    reply = reply.trim();

    addBubble(reply, false);
    history.push({ role: 'assistant', content: reply });

  } catch (e) {
    hideTyping();
    showError("Error: " + e.message);
    console.error(e);
  }

  isTyping = false;
  btn.disabled = false;
  input.focus();
}

btn.addEventListener('click', send);
input.addEventListener('keypress', e => { if (e.key === 'Enter') send(); });

// Auto-focus input on load
input.focus();
</script>

</body>
</html>
